# Every number from the PRD assumptions table lives here. Units are in the key names.

seed: 0

product:
  length_mm: [100, 180]
  width_mm: [60, 110]
  thickness_mm: [15, 30]
  weight_g: [200, 400]
  fat_strip_width_mm: [5, 20]   # along one long edge, random side
  density_g_per_mm3: 0.00105    # ~1.05 g/cm^3, used for weight estimate
  lean_hue_shift: 8             # OpenCV hue units; moves dataset magenta toward pork pink
  paleness_range: [-0.05, 0.4]  # per-piece tint: negative pinker, positive paler

belt:
  width_mm: 600
  speed_nominal_mps: 0.25
  speed_min_mps: 0.0
  speed_max_mps: 0.4
  accel_max_mps2: 0.5           # limit so pieces don't slide
  mm_per_encoder_count: 0.1
  color_bgr: [140, 90, 30]      # blue food-grade belt

arrivals:
  rate_per_min: 50
  bursty: true
  burst_prob: 0.1               # chance an arrival event is a cluster
  burst_size: [2, 3]
  burst_spacing_mm: [-15, 30]   # gap between neighbours along travel; <= 0 touches or overlaps

world:
  dt_s: 0.01
  spawn_x_mm: -200              # belt x where pieces land, upstream of the camera
  end_x_mm: 1200                # pieces are removed (recirculation lane) past this x
  y_margin_mm: 50               # keep piece centers this far from the belt edges

camera:
  width_px: 1280
  height_px: 720
  fov_mm: [600, 340]            # [across belt, along travel]; image rows run along travel
  trigger_every_mm: 20          # frame triggered by encoder distance
  exposure_s: 0.002
  randomize: true               # draw effect strengths per camera from the seed, around these values
  f_px: 1500                    # nominal focal length for the lens model
  tilt_deg: [1.5, -1.0]         # camera pitch, yaw relative to the belt normal
  dist_k: [-0.08, 0.01]         # radial distortion k1, k2 (OpenCV model, normalized by f)
  canvas_margin_px: 100         # extra scene rendered around the frame so warps never show gaps
  vignette: 0.35
  light_gradient: 0.15
  glare_lobes: 2
  glare_strength: 0.9
  noise_sigma: 3.0
  exposure_drift: 0.06
  wb_drift: 0.03
  min_visible_px: 40            # a piece with fewer visible pixels is not in the frame truth
  effects:
    perspective: true
    lens_distortion: true
    vignetting: true
    glare: true
    sensor_noise: true
    motion_blur: true
    exposure_drift: true

robot:
  vmax_mps: 2.0
  amax_mps2: 10.0
  grip_s: 0.15
  release_s: 0.10
  wrist_rotation_penalty_s: 0.05   # applied above wrist_rotation_threshold_deg
  wrist_rotation_threshold_deg: 90
  reach_zone_x_mm: [600, 1000]     # belt-x range the arm can reach
  bin_distance_mm: 400             # bin within this of the pick zone
  gripper_yaw_offset_deg: 90       # fingers close across short axis
  base_mm: [800.0, 300.0]          # arm base in the belt frame (x along travel, y across)
  bin_mm: [800.0, -100.0]          # bin beside the belt, 400 mm from the pick line
  reach_radius_mm: 450             # horizontal reach from the base
  wrist_symmetric: false           # true: gripper is 180-degree symmetric, so rotate the short way
  touching_clearance_mm: 25
  dual_pick: false
  dual_pick_radius_mm: 80
  dual_pick_max_yaw_deg: 30        # a second piece must need a similar gripper yaw
  finger_span_mm: 30               # half-length of each finger along the piece's long axis
  finger_depth_mm: 15              # half-thickness of each finger
  finger_offset_mm: 8              # finger centre this far beyond the piece's long edge

perception:
  detector: yolo                   # yolo | classical (yolo falls back to classical)
  model_path: models/best.pt
  yolo_imgsz: 640
  yolo_conf: 0.25
  yolo_iou: 0.6                   # NMS overlap; lower would suppress overlapping pieces
  pose:
    max_points: 6000              # mask pixels sampled for PCA and extents
    fat_band_mm: [2.0, 9.0]       # edge band (distance in from each long edge) compared for fat
    chroma_weight: 1.0            # paleness = L - chroma_weight * chroma
  classical:
    work_scale: 0.5               # detect at half resolution for speed
    color_threshold: 20.0         # Lab distance from the belt's own median colour
    lightness_weight: 0.25        # L counts a little: rescues pale, low-chroma meat
    open_px: 3
    close_px: 7
    min_area_mm2: 500             # smaller blobs are noise
    min_piece_mm2: 1500           # a watershed part smaller than this means a spurious split
    split_solidity: 0.93          # only blobs less convex than this go through watershed
    split_method: color           # color (watershed on the image) | nearest (nearest core)
    marker_fraction: 0.65         # watershed seeds: distance > this x the blob's max
    valley_px: 7                  # blackhat kernel for the dark edge between overlapping pieces
    valley_threshold: 12          # blackhat response (grey levels) that counts as a valley
    solidity_zero: 0.80           # confidence shape score: 0 at this solidity ...
    solidity_one: 0.95            # ... and 1 at this one
  track_gate_mm: 30
  track_confirm_hits: 2
  tracker:
    border_gate_extra_mm: 20      # a piece cut by the frame edge has a biased centre, so allow more
    center_alpha: 0.5             # exponential smoothing of the measured centre
    angle_window: 5               # median over this many full-view angle measurements
    fov_margin_mm: 40             # tracks this far inside the view edge count as "in the interior"
    interior_miss_limit: 3        # a confirmed track unseen this long in the interior is dropped
    spawn_suppress_mm: 30         # no new track for a detection this close to an existing one
    speed_ema: 0.3                # smoothing of the belt-speed estimate behind the deadline

control:
  min_confidence: 0.3            # tracks below this are never scheduled
  intercept_max_iter: 3         # PRD: converge in at most 3 iterations
  intercept_tol_s: 0.001        # PRD: 1 ms
  adaptive_belt: true
  slack_setpoint_s: 1.6         # slack to hold (tuned on dev seeds): lots of margin, since a stop or slow-down
                                # takes time and the belt can only change speed at 0.5 m/s^2
  slack_clip_s: 3.0             # slack beyond this is treated as "plenty"
  belt_speed_max_mps: 0.25      # controller never runs the belt faster than this (<= belt max)
  pi_kp: 1.5                    # m/s of belt speed per second of slack error
  pi_ki: 0.1                    # m/s per second of accumulated slack error
  pi_integral_max: 1.0          # anti-windup clamp on the accumulated error (s^2)
  stop_slack_s: 0.0             # stop the belt when the next piece's slack falls below this ...
  stop_horizon_s: 1.0           # ... and its deadline is closer than this
  last_resort_blocked: false    # try a finger-blocked piece anyway when it is about to be lost
  last_resort_mm: 200           # ... once it is this close to the end of the zone (flagged collision_risk)
  grip_tolerance_mm: 25         # closed loop: the gripper takes a real piece only if the track is this close

textures:
  dataset_dir: data/raw/meat_detaction
  split: train                     # valid/test stay untouched for the sim-to-real test
  classes: [1]                     # dataset class ids to use: 0 Beef, 1 Pork
  patch_px: 128
  patches_per_image: 4
  min_sharpness: 30.0              # Laplacian variance; below this the crop is blurry
  min_brightness: 60               # mean V (0-255); below this the crop is dark
  border_black_v: 45               # V below this counts as rotation-border background
  fat_min_brightness: 190          # fat = bright and pale
  fat_max_saturation: 70
  min_patches_per_kind: 8          # fewer than this -> fall back to procedural for that kind
