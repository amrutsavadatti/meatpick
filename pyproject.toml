[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meatpick"
version = "0.1.0"
description = "Meat pick-and-place perception demo: simulated belt, camera, detection, tracking and robot control."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
yolo = ["ultralytics"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["meatpick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
